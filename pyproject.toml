[project]
name = "llm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "torch==2.14.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "jupyterlab==4.6.3",
]
