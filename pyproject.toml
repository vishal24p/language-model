[project]
name = "llm"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=2.2.0",
    "matplotlib>=3.11.2",
    "numpy==2.4.6",
    "regex>=2026.9.29",
    "tensorboard>=2.21.0",
    "tokenizers>=0.23.3",
    "torch==2.14.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "jupyterlab==4.6.3",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=language_model.tokenizer --cov-branch --cov-report=term-missing --cov-fail-under=100"
